name: Update engineering dashboard

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "esp32/**"
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: write

concurrency:
  group: engineering-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate dashboard
        run: python dashboard/dashboard.py

      - name: Validate generated README
        run: git diff --check

      - name: Commit dashboard update
        run: |
          git add README.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update embedded systems dashboard"
            git push
          fi
